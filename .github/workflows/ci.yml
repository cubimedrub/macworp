# Checks the whole workspace: lint, tests on Linux/macOS/Windows, a Linux run against real
# container runtimes and a release build of the desktop app per OS. Reproduce locally with the
# same cargo commands (see CONTRIBUTING.md, "Continuous integration").
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the running checks
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The web frontend compiles to wasm
      - run: cargo check -p macworp_web --target wasm32-unknown-unknown
      # The backend alone builds in its default (standalone, Postgres) mode; the workspace build
      # above only sees the embedded mode, enabled by the desktop crate
      - run: cargo check -p macworp_backend

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      # Tests marked #[ignore] (real container runtimes) are not run here
      - run: cargo test --workspace

  # Real container runtimes exist only on the Linux runner (no nested virtualisation on macOS
  # and Windows runners); those checks stay manual, see docs/manual-testing.md
  container-smoke:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      MACWORP_CONTAINER_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Doctor
        run: cargo run -p macworp_worker -- doctor
      # Builds its own image, so no engine image is needed
      - name: Container workflow end to end
        run: cargo test -p macworp_desktop runs_container_workflow_with_all_parameter_types -- --ignored --nocapture
      # Pulls the published engine images; not blocking until proven stable
      - name: Nextflow workflow end to end
        continue-on-error: true
        run: |
          make engine-image-nextflow RUNTIME=${{ matrix.runtime }}
          cargo test -p macworp_desktop runs_nextflow_workflow_with_all_parameter_types -- --ignored --nocapture

  desktop-build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo build -p macworp_desktop --release
