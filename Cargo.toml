[workspace]
resolver = "3"
members = [
    "packages/backend",
    "packages/core",
    "packages/desktop",
    "packages/migration",
    "packages/ui_core",
    "packages/web",
    "packages/worker"
]

[workspace.dependencies]
clap = { version = "4.5.60", features = ["derive"] }
dioxus = { version = "0.7.3" }
manganis = { version = "0.7.3" }
password-auth = { version = "1.0.0" }
reqwest = { version = "0.13.2" }
serde = { version = "1.0.228" }
sea-orm = { version = "2.0.0-rc.37" }
sqlx = "0.8.6"
thiserror = { version = "2.0.18" }
tokio = { version = "1.50.0" }
toml = { version = "1.0.6+spec-1.1.0" }
tracing = { version = "0.1.37" }
tracing-subscriber = { version = "0.3.2" }
urlencoding = { version = "2.1.2" }


# workspace
macworp_backend = { path = "packages/backend" }
macworp_core = { path = "packages/core" }
macworp_database_migration = { path = "packages/migration" }
macworp_ui_core = { path = "packages/ui_core" }
