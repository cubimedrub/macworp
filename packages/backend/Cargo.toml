[package]
name = "macworp_backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "macworp_backend"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
chrono = "0.4.44"
clap = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true, features = ["server"] }
http = { workspace = true }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"]}
macworp_core = { workspace = true }
macworp_database_migration = { workspace = true }
password-auth = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rpassword = { version = "7.4.0", optional = true }
sea-orm = { workspace = true, features = ["macros"] }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
urlencoding = { workspace = true }


[features]
default = ["standalone"]
standalone = ["dep:clap", "dep:rpassword", "dep:toml", "sqlx/postgres", "sqlx/runtime-tokio", "sea-orm/sqlx-postgres"]
integration = ["dep:dioxus", "sqlx/sqlite", "sqlx/runtime-tokio", "sea-orm/sqlx-sqlite"]
