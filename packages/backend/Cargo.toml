[package]
name = "macworp_backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "macworp_backend"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
clap = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true, features = ["server"] }
macworp_core = { workspace = true }
sea-orm = { version = "2.0.0-rc.34", feature = ["macros"] }
serde = { workspace = true, features = ["derive"] }
sqlx = "0.8.6"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }


[features]
default = ["standalone"]
standalone = ["dep:clap", "sqlx/postgres", "sea-orm/sqlx-postgres"]
integration = ["dep:dioxus", "sqlx/sqlite", "sea-orm/sqlx-sqlite"]
