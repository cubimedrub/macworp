[package]
name = "macworp_backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "macworp_backend"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["multipart", "macros"] }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true, optional = true }
futures-util = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
macworp_core = { workspace = true, features = ["database"] }
macworp_database_migration = { workspace = true }
password-auth = { workspace = true }
git2 = { workspace = true, features = ["https", "vendored-libgit2", "vendored-openssl"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rpassword = { workspace = true, optional = true }
sea-orm = { workspace = true, features = ["macros"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io"] }
toml = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v7"] }
zip = { workspace = true, features = ["deflate"] }


[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }

[features]
default = ["standalone"]
standalone = ["dep:clap", "dep:rpassword", "dep:toml", "sqlx/postgres", "sqlx/runtime-tokio", "sea-orm/sqlx-postgres"]
integration = ["sqlx/sqlite", "sqlx/runtime-tokio", "sea-orm/sqlx-sqlite"]
