[package]
name = "macworp_backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "macworp_backend"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
clap = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true, features = ["server"] }
macworp_core = { workspace = true }
sea-orm = { version = "2.0.0-rc.34", feature = ["macros"] }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }


[features]
default = ["standalone"]
standalone = ["dep:clap", "dep:toml", "sqlx/postgres", "sqlx/runtime-tokio", "sea-orm/sqlx-postgres"]
integration = ["dep:dioxus", "sqlx/sqlite", "sqlx/runtime-tokio", "sea-orm/sqlx-sqlite"]
